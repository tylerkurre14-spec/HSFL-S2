<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSFL More</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #e62c47;
  --page: #f4f5f7;
  --border: #dfdfe1;
  --text: #202127;
  --muted: #8d8e94;
}

body {
  margin: 0;
  padding-bottom: 100px;

  background: var(--page);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.page {
  width: 100%;
  max-width: 760px;

  margin: 0 auto;

  padding: 18px 11px 30px;
}

h1 {
  margin: 3px 2px 15px;

  font-size: 31px;
  font-weight: 950;

  letter-spacing: -1.4px;
}

.tabs {
  margin-bottom: 14px;

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 7px;
}

.tab {
  height: 42px;

  border: 1px solid var(--border);
  border-radius: 999px;

  background: white;
  color: #77787e;

  font-size: 8px;
  font-weight: 950;
}

.tab.active {
  background: var(--red);
  border-color: var(--red);

  color: white;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

.card {
  overflow: hidden;

  background: white;

  border: 1px solid var(--border);
  border-radius: 19px;
}

.card-header {
  min-height: 59px;

  padding: 0 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: white;

  background:
    linear-gradient(
      90deg,
      #96131e,
      #c32033,
      #e94152
    );
}

.card-header strong {
  font-size: 14px;
  font-weight: 950;
}

.card-header span {
  font-size: 8px;
  font-weight: 850;

  opacity: .8;
}

.filters {
  padding: 11px;

  display: flex;

  gap: 6px;

  overflow-x: auto;

  border-bottom: 1px solid #e8e8e9;
}

.filter {
  height: 32px;

  flex: 0 0 auto;

  padding: 0 12px;

  border: 1px solid #dddddf;
  border-radius: 999px;

  background: #f6f6f7;
  color: #77787e;

  font-size: 7px;
  font-weight: 950;
}

.filter.active {
  background: #222329;
  border-color: #222329;

  color: white;
}

.team-row,
.champion-row {
  min-height: 61px;

  padding: 8px 11px;

  display: flex;
  align-items: center;

  gap: 10px;

  border-bottom: 1px solid #e8e8e9;
}

.team-row:last-child,
.champion-row:last-child {
  border-bottom: 0;
}

.logo-box {
  width: 65px;
  height: 39px;

  flex: 0 0 auto;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background: #222;
}

.logo-box img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.team-info {
  min-width: 0;
}

.team-info strong {
  display: block;

  font-size: 10px;
  font-weight: 950;
}

.team-info span {
  display: block;

  margin-top: 3px;

  color: #929399;

  font-size: 7px;
  font-weight: 850;

  text-transform: uppercase;
}

.champion-season {
  width: 52px;
  height: 38px;

  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background: var(--red);
  color: white;

  font-size: 8px;
  font-weight: 950;
}

.empty {
  padding: 38px 15px;

  text-align: center;

  color: var(--muted);

  font-size: 9px;
  font-weight: 850;
}


/* TEAM COLORS */

.auburn { background:#123f76; }
.parker { background:#151515; }
.cornercanyon { background:#27323e; }
.stfrances { background:#542772; }
.buford { background:#147747; }
.bosco { background:#142d54; }
.centennial { background:#262626; }
.imgacademy,
.img { background:#087bc1; }
.norland { background:#7c1026; }
.saraland { background:#b41529; }
.mckinney { background:#173f78; }
.guyer { background:#552a72; }
.stjames { background:#17365f; }
.dutchfork,
.silverfoxes { background:#000; }


.bottom-nav {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  width: calc(100% - 24px);
  max-width: 520px;

  height: 67px;

  z-index: 1000;

  padding: 6px;

  display: grid;
  grid-template-columns: repeat(5,1fr);

  background: rgba(255,255,255,.97);

  border: 1px solid #ddd;
  border-radius: 999px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);
}

.nav-item {
  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 999px;

  color: #929399;

  font-size: 7px;
  font-weight: 900;
}

.nav-icon {
  font-size: 17px;
  line-height: 1;
}

.nav-item.active {
  background: var(--red);
  color: white;
}

</style>
</head>


<body>

<main class="page">

  <h1>
    More
  </h1>


  <div class="tabs">

    <button
      class="tab active"
      data-tab="champions"
    >
      Super Bowl Champions
    </button>

    <button
      class="tab"
      data-tab="teams"
    >
      Teams
    </button>

  </div>



  <section
    class="panel active"
    id="panel-champions"
  >

    <div class="card">

      <div class="card-header">

        <strong>
          Super Bowl Champions
        </strong>

        <span>
          HSFL HISTORY
        </span>

      </div>


      <div id="champions"></div>

    </div>

  </section>



  <section
    class="panel"
    id="panel-teams"
  >

    <div class="card">

      <div class="card-header">

        <strong>
          Teams
        </strong>

        <span id="teamCount">
          14 TEAMS
        </span>

      </div>


      <div class="filters">

        <button
          class="filter active"
          data-conference="all"
        >
          ALL
        </button>

        <button
          class="filter"
          data-conference="american"
        >
          AMERICAN
        </button>

        <button
          class="filter"
          data-conference="national"
        >
          NATIONAL
        </button>

      </div>


      <div id="teams"></div>

    </div>

  </section>

</main>



<nav class="bottom-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <div class="nav-icon">⌂</div>
    Home
  </a>

  <a
    class="nav-item"
    href="standings.html"
  >
    <div class="nav-icon">≡</div>
    Standings
  </a>

  <a
    class="nav-item"
    href="scores.html"
  >
    <div class="nav-icon">▣</div>
    Scores
  </a>

  <a
    class="nav-item"
    href="stats.html"
  >
    <div class="nav-icon">▥</div>
    Stats
  </a>

  <a
    class="nav-item active"
    href="more.html"
  >
    <div class="nav-icon">•••</div>
    More
  </a>

</nav>



<script>

const SUPABASE_URL =
  "https://btjpzkgblmuetsomnvpw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9FmVKyCrGSsBbu3LIni6eQ_U95Fl0Vj";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let teams = [];
let champions = [];
let selectedConference = "all";



function renderTeams() {

  let filtered =
    teams;


  if (
    selectedConference !==
    "all"
  ) {

    filtered =
      teams.filter(
        team =>
          team.conference ===
          selectedConference
      );

  }


  document.getElementById(
    "teamCount"
  ).textContent =
    `${filtered.length} TEAMS`;


  const container =
    document.getElementById(
      "teams"
    );


  if (
    !filtered.length
  ) {

    container.innerHTML =
      '<div class="empty">No teams found.</div>';

    return;

  }


  container.innerHTML =
    filtered
    .map(
      team => `

        <div class="team-row">

          <div
            class="logo-box ${team.class_name || team.slug}"
          >

            <img
              src="${team.logo_path}"
              alt="${team.name}"
            >

          </div>


          <div class="team-info">

            <strong>
              ${team.name}
            </strong>

            <span>

              ${team.short}

              ·

              ${
                team.conference === "american"
                ? "American Conference"
                :
                team.conference === "national"
                ? "National Conference"
                : "Other"
              }

            </span>

          </div>

        </div>

      `
    )
    .join("");

}



function renderChampions() {

  const container =
    document.getElementById(
      "champions"
    );


  if (
    !champions.length
  ) {

    container.innerHTML = `

      <div class="empty">
        No Super Bowl champions have been entered yet.
      </div>

    `;

    return;

  }


  container.innerHTML =
    champions
    .map(
      champion => {

        const team =
          teams.find(
            item =>
              item.slug ===
              champion.team_slug
          );


        if (
          !team
        ) {

          return "";

        }


        return `

          <div class="champion-row">

            <div class="champion-season">
              S${champion.season}
            </div>


            <div
              class="logo-box ${team.class_name || team.slug}"
            >

              <img
                src="${team.logo_path}"
                alt="${team.name}"
              >

            </div>


            <div class="team-info">

              <strong>
                ${team.name}
              </strong>

              <span>
                Season ${champion.season} Champion
              </span>

            </div>

          </div>

        `;

      }
    )
    .join("");

}



document
.querySelectorAll(
  "[data-tab]"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const tab =
          button.dataset.tab;


        document
        .querySelectorAll(
          "[data-tab]"
        )
        .forEach(
          item => {

            item.classList.toggle(
              "active",
              item === button
            );

          }
        );


        document
        .querySelectorAll(
          ".panel"
        )
        .forEach(
          panel => {

            panel.classList.toggle(
              "active",
              panel.id ===
              `panel-${tab}`
            );

          }
        );

      }
    );

  }
);



document
.querySelectorAll(
  "[data-conference]"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        selectedConference =
          button.dataset.conference;


        document
        .querySelectorAll(
          "[data-conference]"
        )
        .forEach(
          item => {

            item.classList.toggle(
              "active",
              item === button
            );

          }
        );


        renderTeams();

      }
    );

  }
);



async function loadMore() {

  const [
    teamResult,
    championResult
  ] =
    await Promise.all([

      sb
        .from("hsfl_teams")
        .select("*")
        .eq("active",true)
        .order("display_order"),

      sb
        .from("hsfl_champions")
        .select("*")
        .order(
          "season",
          {
            ascending:false
          }
        )

    ]);


  if (
    teamResult.error
  ) {

    document.getElementById(
      "teams"
    ).innerHTML =
      '<div class="empty">Could not load teams.</div>';

    return;

  }


  teams =
    teamResult.data
    ||
    [];


  champions =
    championResult.data
    ||
    [];


  renderTeams();

  renderChampions();

}


loadMore();

</script>

</body>
</html>
