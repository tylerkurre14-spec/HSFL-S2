<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HSFL S2</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

<main class="app">


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <img
      src="IMG_8099.jpeg"
      alt="HSFL Football"
    >

  </section>



  <!-- =========================
       MATCHUPS
  ========================== -->

  <section class="card">

    <div class="matchups-heading">

      <h1>MATCHUPS</h1>

      <div class="heading-pills">

        <span id="weekPill">
          WEEK 1
        </span>

        <span>
          UPCOMING
        </span>

      </div>

    </div>



    <!-- MATCHUP CONTROLS -->

    <div class="filters">


      <!-- WEEK DROPDOWN -->

      <div class="week-picker">

        <button
          class="filter-button"
          id="weekButton"
          type="button"
        >

          <span id="selectedWeek">
            Week 1
          </span>

          <svg
            viewBox="0 0 24 24"
            class="dropdown-icon"
            aria-hidden="true"
          >
            <path
              d="M6 9l6 6 6-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        </button>


        <div
          class="week-menu"
          id="weekMenu"
        >
        </div>

      </div>



      <!-- ALL SCORES -->

      <a
        href="scores.html"
        class="filter-button all-scores-button"
      >
        <span>
          all scores
        </span>

        <span class="scores-arrow">
          →
        </span>
      </a>

    </div>



    <div class="red-divider"></div>



    <!-- MATCHUPS -->

    <div
      class="games"
      id="gamesContainer"
    ></div>



    <a
      href="scores.html"
      class="red-button"
    >

      <span>
        VIEW ALL SCORES
      </span>

      <svg
        viewBox="0 0 24 24"
        class="button-arrow"
        aria-hidden="true"
      >
        <path
          d="M9 5l7 7-7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </a>

  </section>



  <!-- =========================
       STAT LEADERS
  ========================== -->

  <section class="card">

    <h1 class="section-title">
      STAT LEADERS
    </h1>


    <div class="red-divider"></div>


    <button
      class="big-dropdown"
      type="button"
    >

      <span>
        PASSING YARDS
      </span>

      <svg
        viewBox="0 0 24 24"
        class="dropdown-icon"
        aria-hidden="true"
      >
        <path
          d="M6 9l6 6 6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </button>


    <div class="empty-area">

      <strong>
        SEASON 2
      </strong>

      <span>
        Stats will appear after games are recorded.
      </span>

    </div>


    <a
      href="stats.html"
      class="red-button"
    >

      <span>
        VIEW ALL STATS
      </span>

      <svg
        viewBox="0 0 24 24"
        class="button-arrow"
        aria-hidden="true"
      >
        <path
          d="M9 5l7 7-7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </a>

  </section>



  <!-- =========================
       STANDINGS
  ========================== -->

  <section class="card">

    <h1 class="section-title">
      STANDINGS
    </h1>


    <div class="red-divider"></div>



    <!-- CONFERENCE DROPDOWN -->

    <div class="conference-picker">

      <button
        class="big-dropdown"
        id="conferenceButton"
        type="button"
      >

        <span id="conferenceName">
          AMERICAN
        </span>

        <svg
          viewBox="0 0 24 24"
          class="dropdown-icon"
          aria-hidden="true"
        >
          <path
            d="M6 9l6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>


      <div
        class="conference-menu"
        id="conferenceMenu"
      >

        <button
          class="conference-option"
          data-conference="american"
          type="button"
        >
          AMERICAN
        </button>

        <button
          class="conference-option"
          data-conference="national"
          type="button"
        >
          NATIONAL
        </button>

      </div>

    </div>



    <!-- STANDINGS TABLE -->

    <div class="standings-table">


      <div class="standings-header">

        <span>
          TEAM
        </span>

        <span>
          W
        </span>

        <span>
          L
        </span>

        <span>
          PD
        </span>

      </div>


      <div id="standingsBody">
      </div>


    </div>



    <a
      href="standings.html"
      class="red-button"
    >

      <span>
        VIEW FULL STANDINGS
      </span>

      <svg
        viewBox="0 0 24 24"
        class="button-arrow"
        aria-hidden="true"
      >
        <path
          d="M9 5l7 7-7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </a>

  </section>


</main>



<!-- =========================
     MATCHUP COMPARISON
========================== -->

<div
  class="comparison-overlay"
  id="comparisonOverlay"
  aria-hidden="true"
>

  <div class="comparison-modal">


    <button
      class="comparison-close"
      id="comparisonClose"
      type="button"
      aria-label="Close matchup comparison"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M6 6l12 12M18 6L6 18"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
        />
      </svg>

    </button>



    <div class="comparison-title">
      MATCHUP COMPARISON
    </div>


    <div
      class="comparison-content"
      id="comparisonContent"
    >
    </div>


  </div>

</div>



<!-- =========================
     BOTTOM NAV
========================== -->

      />

      <path

      />

      <path

      />

      <path
        d="M12 14v4"

      />

    </svg>

    <span class="nav-label">
      Standings
    </span>

  </a>



  <!-- SCORES -->

  <a
    href="scores.html"
    class="nav-item"
    aria-label="Scores"
  >

    <svg
      class="nav-svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <rect
        x="3.5"
        y="5"
        width="17"
        height="14"
        rx="2.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />

      <path
        d="M8 9h3M8 13h3M15 9h1M15 13h1"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

    </svg>

    <span class="nav-label">
      Scores
    </span>

  </a>



  <!-- STATS -->

  <a
    href="stats.html"
    class="nav-item"
    aria-label="Stats"
  >

    <svg
      class="nav-svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="M5 20V13M12 20V8M19 20V4"

  </a>



  <!-- MORE -->

  <a

    class="nav-item"

  >

    <svg
      class="nav-svg"
      viewBox="0 0 24 24"

      <circle
        cx="5"

        r="1.5"

      />

      <circle

<script src="script.js"></script>


</body>
</html>
