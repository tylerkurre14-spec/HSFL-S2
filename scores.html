<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSFL Scores</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #e62c47;
  --red-dark: #a21525;
  --page: #f4f5f7;
  --card: #ffffff;
  --border: #e1e1e3;
  --text: #202127;
  --muted: #8d8e94;
}

body {
  margin: 0;
  padding-bottom: 100px;

  background: var(--page);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
select {
  font-family: inherit;
}

.page {
  width: 100%;
  max-width: 760px;

  margin: 0 auto;

  padding: 18px 12px 30px;
}

.page-title {
  margin: 3px 2px 18px;

  font-size: 31px;
  font-weight: 950;

  letter-spacing: -1.4px;
}

.score-card {
  overflow: hidden;

  margin-bottom: 12px;

  background: white;

  border: 1px solid var(--border);
  border-radius: 22px;
}

.score-header {
  padding: 16px 15px 13px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 10px;
}

.score-header-left {
  display: flex;
  align-items: center;

  gap: 7px;
}

.week-pill,
.status-pill {
  min-height: 26px;

  padding: 0 10px;

  display: flex;
  align-items: center;

  border-radius: 999px;

  font-size: 8px;
  font-weight: 950;
}

.week-pill {
  background: var(--red);
  color: white;
}

.status-pill {
  background: #f0f0f2;
  color: #77787e;
}

.week-select {
  height: 36px;

  padding: 0 10px;

  border: 1px solid #dedee1;
  border-radius: 9px;

  background: white;

  color: #222329;

  font-size: 9px;
  font-weight: 900;
}

.red-line {
  height: 5px;

  background:
    linear-gradient(
      90deg,
      #99151f,
      #c72134,
      #ee4257
    );
}

.games {
  padding: 11px;
}

.game {
  position: relative;

  margin-bottom: 9px;

  padding: 11px 9px;

  border: 1px solid #e5e5e6;
  border-radius: 15px;

  background: #fafafa;
}

.game:last-child {
  margin-bottom: 0;
}

.featured {
  border-color: #ef9aa7;
}

.featured-label {
  margin-bottom: 8px;

  color: var(--red);

  font-size: 7px;
  font-weight: 950;

  letter-spacing: .8px;
}

.game-main {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    64px
    minmax(0,1fr);

  align-items: center;

  gap: 8px;
}

.team {
  min-width: 0;

  text-align: center;
}

.logo-box {
  width: 66px;
  height: 39px;

  margin: 0 auto 7px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 8px;

  background: #222;
}

.logo-box img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.team-short {
  font-size: 10px;
  font-weight: 950;
}

.team-name {
  margin-top: 2px;

  color: #83848a;

  font-size: 7px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.record {
  margin-top: 3px;

  color: #96979c;

  font-size: 7px;
  font-weight: 850;
}

.center {
  text-align: center;
}

.vs {
  color: var(--red);

  font-size: 11px;
  font-weight: 950;
}

.final-score {
  color: #202127;

  font-size: 20px;
  font-weight: 950;
}

.game-status {
  margin-top: 4px;

  color: #999a9f;

  font-size: 7px;
  font-weight: 900;
}

.compare {
  margin-top: 6px;

  border: 0;

  background: transparent;

  color: var(--red);

  font-size: 7px;
  font-weight: 950;
}

.empty {
  padding: 35px 15px;

  text-align: center;

  color: #8d8e94;

  font-size: 10px;
  font-weight: 850;
}


/* TEAM COLORS */

.auburn { background: #123f76; }
.parker { background: #151515; }
.cornercanyon { background: #27323e; }
.stfrances { background: #542772; }
.buford { background: #147747; }
.bosco { background: #142d54; }
.centennial { background: #262626; }
.imgacademy { background: #087bc1; }
.img { background: #087bc1; }
.norland { background: #7c1026; }
.saraland { background: #b41529; }
.mckinney { background: #173f78; }
.guyer { background: #552a72; }
.stjames { background: #17365f; }
.dutchfork { background: #000; }
.silverfoxes { background: #000; }


/* MODAL */

.modal {
  position: fixed;

  inset: 0;

  z-index: 5000;

  display: none;
  align-items: flex-end;
  justify-content: center;

  padding: 12px;

  background: rgba(0,0,0,.45);
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 500px;

  padding: 17px;

  background: white;

  border-radius: 23px;
}

.modal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 16px;
}

.modal-top strong {
  font-size: 18px;
  font-weight: 950;
}

.close {
  width: 35px;
  height: 35px;

  border: 0;
  border-radius: 50%;

  background: #eeeeef;

  font-size: 16px;
  font-weight: 900;
}

.compare-grid {
  display: grid;
  grid-template-columns: 1fr 55px 1fr;

  gap: 8px;

  text-align: center;
}

.compare-team strong {
  display: block;

  font-size: 12px;
  font-weight: 950;
}

.compare-team span {
  display: block;

  margin-top: 4px;

  color: #88898f;

  font-size: 8px;
  font-weight: 800;
}

.compare-vs {
  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--red);

  font-size: 11px;
  font-weight: 950;
}


/* BOTTOM NAV */

.bottom-nav {
  position: fixed;

  left: 50%;
  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  width: calc(100% - 24px);
  max-width: 520px;

  height: 67px;

  z-index: 2000;

  padding: 6px;

  display: grid;
  grid-template-columns: repeat(5,1fr);

  background: rgba(255,255,255,.97);

  border: 1px solid #dddddf;
  border-radius: 999px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);
}

.nav-item {
  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 999px;

  color: #929399;

  font-size: 7px;
  font-weight: 900;
}

.nav-icon {
  font-size: 17px;
  line-height: 1;
}

.nav-item.active {
  background: var(--red);
  color: white;
}

</style>
</head>


<body>

<main class="page">

  <h1 class="page-title">
    Scores
  </h1>


  <section class="score-card">

    <div class="score-header">

      <div class="score-header-left">

        <div
          class="week-pill"
          id="weekPill"
        >
          WEEK 1
        </div>

        <div class="status-pill">
          SCORES
        </div>

      </div>


      <select
        class="week-select"
        id="weekSelect"
      ></select>

    </div>


    <div class="red-line"></div>


    <div
      class="games"
      id="games"
    ></div>

  </section>

</main>



<div
  class="modal"
  id="compareModal"
>

  <div class="modal-card">

    <div class="modal-top">

      <strong>
        Matchup Comparison
      </strong>

      <button
        class="close"
        id="closeModal"
      >
        ×
      </button>

    </div>


    <div
      class="compare-grid"
      id="compareContent"
    ></div>

  </div>

</div>



<nav class="bottom-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <div class="nav-icon">⌂</div>
    Home
  </a>

  <a
    class="nav-item"
    href="standings.html"
  >
    <div class="nav-icon">≡</div>
    Standings
  </a>

  <a
    class="nav-item active"
    href="scores.html"
  >
    <div class="nav-icon">▣</div>
    Scores
  </a>

  <a
    class="nav-item"
    href="stats.html"
  >
    <div class="nav-icon">▥</div>
    Stats
  </a>

  <a
    class="nav-item"
    href="more.html"
  >
    <div class="nav-icon">•••</div>
    More
  </a>

</nav>



<script>

const SUPABASE_URL =
  "https://btjpzkgblmuetsomnvpw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9FmVKyCrGSsBbu3LIni6eQ_U95Fl0Vj";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let teams = {};
let games = [];
let overrides = {};
let currentWeek = 1;



function calculateRecords() {

  const records = {};


  Object.values(
    teams
  )
  .forEach(
    team => {

      records[
        team.slug
      ] = {

        wins: 0,
        losses: 0,
        pd: 0

      };

    }
  );


  games.forEach(
    game => {

      if (
        game.status !== "final"
        &&
        game.status !== "forfeit"
      ) {

        return;

      }


      if (
        game.away_score === null
        ||
        game.home_score === null
      ) {

        return;

      }


      const away =
        records[
          game.away_team
        ];


      const home =
        records[
          game.home_team
        ];


      if (
        !away
        ||
        !home
      ) {

        return;

      }


      away.pd +=
        game.away_score -
        game.home_score;


      home.pd +=
        game.home_score -
        game.away_score;


      if (
        game.away_score >
        game.home_score
      ) {

        away.wins++;
        home.losses++;

      }

      else if (
        game.home_score >
        game.away_score
      ) {

        home.wins++;
        away.losses++;

      }

    }
  );


  Object.entries(
    overrides
  )
  .forEach(
    ([slug,row]) => {

      if (
        !records[slug]
      ) {

        return;

      }


      if (
        row.wins !== null
      ) {

        records[slug].wins =
          row.wins;

      }


      if (
        row.losses !== null
      ) {

        records[slug].losses =
          row.losses;

      }


      if (
        row.pd !== null
      ) {

        records[slug].pd =
          row.pd;

      }

    }
  );


  return records;

}



function statusText(
  game
) {

  if (
    game.status === "final"
  ) {

    return "FINAL";

  }


  if (
    game.status === "live"
  ) {

    return "LIVE";

  }


  if (
    game.status === "forfeit"
  ) {

    return "FINAL · FORFEIT";

  }


  if (
    game.status === "cancelled"
  ) {

    return "CANCELLED";

  }


  return "UPCOMING";

}



function renderGames() {

  const week =
    Number(
      document.getElementById(
        "weekSelect"
      ).value
      ||
      currentWeek
    );


  document.getElementById(
    "weekPill"
  ).textContent =
    `WEEK ${week}`;


  const records =
    calculateRecords();


  const weekGames =
    games.filter(
      game =>
        Number(game.week) ===
        week
    );


  const container =
    document.getElementById(
      "games"
    );


  container.innerHTML =
    "";


  if (
    !weekGames.length
  ) {

    container.innerHTML =
      '<div class="empty">No games scheduled for this week.</div>';

    return;

  }


  weekGames.forEach(
    game => {

      const away =
        teams[
          game.away_team
        ];


      const home =
        teams[
          game.home_team
        ];


      if (
        !away
        ||
        !home
      ) {

        return;

      }


      const hasScore =
        game.away_score !== null
        &&
        game.home_score !== null;


      const middle =
        hasScore
        ? `

          <div class="final-score">
            ${game.away_score}-${game.home_score}
          </div>

        `
        : `

          <div class="vs">
            VS
          </div>

        `;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "game" +
        (
          game.featured
            ? " featured"
            : ""
        );


      card.innerHTML = `

        ${
          game.featured
          ? `
            <div class="featured-label">
              GAME OF THE WEEK
            </div>
          `
          : ""
        }


        <div class="game-main">

          <div class="team">

            <div
              class="logo-box ${away.class_name || away.slug}"
            >

              <img
                src="${away.logo_path}"
                alt="${away.name}"
              >

            </div>

            <div class="team-short">
              ${away.short}
            </div>

            <div class="team-name">
              ${away.name}
            </div>

            <div class="record">
              ${records[away.slug]?.wins || 0}-${records[away.slug]?.losses || 0}
            </div>

          </div>


          <div class="center">

            ${middle}

            <div class="game-status">
              ${statusText(game)}
            </div>

            <button
              class="compare"
              data-compare="${game.id}"
            >
              COMPARE ⇄
            </button>

          </div>


          <div class="team">

            <div
              class="logo-box ${home.class_name || home.slug}"
            >

              <img
                src="${home.logo_path}"
                alt="${home.name}"
              >

            </div>

            <div class="team-short">
              ${home.short}
            </div>

            <div class="team-name">
              ${home.name}
            </div>

            <div class="record">
              ${records[home.slug]?.wins || 0}-${records[home.slug]?.losses || 0}
            </div>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  document
  .querySelectorAll(
    "[data-compare]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          openComparison(
            button.dataset.compare
          );

        }
      );

    }
  );

}



function openComparison(
  gameId
) {

  const game =
    games.find(
      item =>
        item.id ===
        gameId
    );


  if (
    !game
  ) {

    return;

  }


  const away =
    teams[
      game.away_team
    ];


  const home =
    teams[
      game.home_team
    ];


  const records =
    calculateRecords();


  document.getElementById(
    "compareContent"
  ).innerHTML = `

    <div class="compare-team">

      <strong>
        ${away.short}
      </strong>

      <span>
        ${records[away.slug].wins}-${records[away.slug].losses}
      </span>

      <span>
        PD ${records[away.slug].pd > 0 ? "+" : ""}${records[away.slug].pd}
      </span>

    </div>


    <div class="compare-vs">
      VS
    </div>


    <div class="compare-team">

      <strong>
        ${home.short}
      </strong>

      <span>
        ${records[home.slug].wins}-${records[home.slug].losses}
      </span>

      <span>
        PD ${records[home.slug].pd > 0 ? "+" : ""}${records[home.slug].pd}
      </span>

    </div>

  `;


  document.getElementById(
    "compareModal"
  ).classList.add(
    "show"
  );

}



document.getElementById(
  "closeModal"
)
.addEventListener(
  "click",
  () => {

    document.getElementById(
      "compareModal"
    ).classList.remove(
      "show"
    );

  }
);



async function loadScores() {

  const [
    teamResult,
    gameResult,
    overrideResult,
    settingsResult
  ] =
    await Promise.all([

      sb
        .from("hsfl_teams")
        .select("*")
        .eq("active",true)
        .order("display_order"),

      sb
        .from("hsfl_games")
        .select("*")
        .eq("season",2)
        .order("week"),

      sb
        .from("hsfl_team_record_overrides")
        .select("*"),

      sb
        .from("hsfl_settings")
        .select("*")
        .eq("key","league")
        .maybeSingle()

    ]);


  if (
    teamResult.error
    ||
    gameResult.error
  ) {

    document.getElementById(
      "games"
    ).innerHTML =
      '<div class="empty">Could not load scores.</div>';

    return;

  }


  teams = {};


  teamResult.data.forEach(
    team => {

      teams[
        team.slug
      ] =
        team;

    }
  );


  games =
    gameResult.data
    ||
    [];


  overrides = {};


  (
    overrideResult.data
    ||
    []
  )
  .forEach(
    row => {

      overrides[
        row.team_slug
      ] =
        row;

    }
  );


  currentWeek =
    Number(
      settingsResult.data
        ?.value
        ?.current_week
      ||
      1
    );


  const weeks =
    [
      ...new Set(
        games.map(
          game =>
            Number(game.week)
        )
      )
    ]
    .sort(
      (a,b) =>
        a-b
    );


  document.getElementById(
    "weekSelect"
  ).innerHTML =
    weeks
    .map(
      week => `

        <option value="${week}">
          Week ${week}
        </option>

      `
    )
    .join("");


  if (
    weeks.includes(
      currentWeek
    )
  ) {

    document.getElementById(
      "weekSelect"
    ).value =
      currentWeek;

  }


  renderGames();

}



document.getElementById(
  "weekSelect"
)
.addEventListener(
  "change",
  renderGames
);


loadScores();

</script>

</body>
</html>
