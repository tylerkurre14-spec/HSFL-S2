<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stats | HSFL S2</title>

  <link rel="stylesheet" href="style.css">


  <style>

    /* =====================================================
       STATS PAGE
    ===================================================== */

    .stats-page {
      padding-top: 22px;
    }


    .stats-title {
      margin: 0 3px 24px;

      font-size: 31px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: -1px;
    }



    /* =====================================================
       CATEGORY BUTTONS
       WRAP LIKE AFL
    ===================================================== */

    .stats-tabs {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 45px;
    }


    .stats-tab {
      min-height: 46px;

      padding: 0 15px;

      border: 2px solid #d9d9d9;
      border-radius: 10px;

      background: #fff;

      color: #22232a;

      font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;
      font-weight: 900;

      text-transform: uppercase;

      cursor: pointer;

      white-space: nowrap;
    }


    .stats-tab.active {
      background: #ed1f3b;
      border-color: #ed1f3b;
      color: #fff;
    }



    /* =====================================================
       CATEGORY TITLE
    ===================================================== */

    .category-title {
      margin: 0 2px 20px;

      color: #292a2e;

      font-size: 27px;
      line-height: 1;

      font-weight: 900;

      text-transform: lowercase;

      letter-spacing: -.7px;
    }



    /* =====================================================
       SEARCH
    ===================================================== */

    .stats-search-wrap {
      position: relative;

      width: 100%;

      margin-bottom: 24px;
    }


    .stats-search-icon {
      position: absolute;

      left: 19px;
      top: 50%;

      width: 21px;
      height: 21px;

      transform: translateY(-50%);

      color: #a3a9b4;

      pointer-events: none;
    }


    .stats-search {
      width: 100%;
      height: 58px;

      padding: 0 18px 0 51px;

      border: 1.5px solid #d5d5d5;
      border-radius: 999px;

      outline: none;

      background: #fff;

      color: #202127;

      font-size: 15px;
      font-weight: 700;
    }


    .stats-search::placeholder {
      color: #b7b7b9;
    }


    .stats-search:focus {
      border-color: #ed1f3b;
    }



    /* =====================================================
       DIVIDER
    ===================================================== */

    .stats-divider {
      width: 100%;
      height: 2px;

      margin-bottom: 20px;

      background: #dedede;
    }



    /* =====================================================
       TABLE CARD
    ===================================================== */

    .stats-card {
      width: 100%;

      overflow: hidden;

      margin-bottom: 18px;

      background: #fff;

      border: 1px solid #d9d9d9;
      border-radius: 17px;
    }


    .stats-table-header,
    .stats-row {
      display: grid;
      align-items: center;
    }


    .stats-table-header {
      min-height: 42px;

      padding: 0 7px;

      border-bottom: 1px solid #ddd;

      background: #f8f8f8;

      color: #aaa;

      font-size: 8px;
      font-weight: 900;
    }


    .stats-row {
      min-height: 50px;

      padding: 4px 7px;

      border-bottom: 1px solid #dedede;

      background: #fff;
    }


    .stats-row:last-child {
      border-bottom: 0;
    }



    /* =====================================================
       GRID SIZES
    ===================================================== */

    .passing-grid {
      grid-template-columns:
        30px
        minmax(95px, 1fr)
        30px
        30px
        38px
        28px
        28px;
    }


    .rushing-grid {
      grid-template-columns:
        30px
        minmax(100px, 1fr)
        33px
        40px
        29px
        35px;
    }


    .receiving-grid,
    .tightends-grid {
      grid-template-columns:
        30px
        minmax(100px, 1fr)
        33px
        40px
        29px
        35px;
    }


    .center-grid {
      grid-template-columns:
        30px
        minmax(120px, 1fr)
        44px
        44px
        44px;
    }


    .defensiveends-grid,
    .linebackers-grid,
    .secondary-grid {
      grid-template-columns:
        30px
        minmax(88px, 1fr)
        31px
        31px
        34px
        31px
        31px;
    }


    .kicking-grid {
      grid-template-columns:
        30px
        minmax(105px, 1fr)
        37px
        37px
        37px
        37px;
    }


    .stats-table-header span:not(:nth-child(2)),
    .stats-row > span:not(:nth-child(2)) {
      text-align: center;
    }



    /* =====================================================
       RANK
    ===================================================== */

    .stats-rank {
      width: 25px;
      height: 25px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #ed1f3b;

      color: #fff;

      font-size: 9px;
      font-weight: 900;
    }



    /* =====================================================
       PLAYER
    ===================================================== */

    .stats-player {
      min-width: 0;
    }


    .stats-player-name {
      display: block;

      color: #24252a;

      font-size: 9px;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .stats-player-team {
      display: block;

      margin-top: 2px;

      color: #999;

      font-size: 7px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .stats-number {
      color: #222329;

      font-size: 9px;
      font-weight: 900;
    }



    /* =====================================================
       EMPTY STATE
    ===================================================== */

    .stats-empty {
      min-height: 120px;

      padding: 28px 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: #aaa;

      font-size: 11px;
      font-weight: 800;
    }



    /* =====================================================
       INFO TEXT
    ===================================================== */

    .stats-info {
      margin: 18px 1px 25px;

      color: #b2b2b4;

      font-size: 10px;
      font-weight: 700;

      line-height: 1.55;
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 430px) {

      .stats-page {
        padding-left: 10px;
        padding-right: 10px;
      }


      .stats-title {
        font-size: 29px;
      }


      .stats-tabs {
        gap: 7px;

        margin-bottom: 40px;
      }


      .stats-tab {
        min-height: 43px;

        padding: 0 12px;

        font-size: 11px;
      }


      .category-title {
        font-size: 25px;
      }


      .stats-search {
        height: 55px;

        font-size: 14px;
      }

    }



    @media (max-width: 375px) {

      .stats-tab {
        padding: 0 10px;

        font-size: 10px;
      }


      .passing-grid {
        grid-template-columns:
          27px
          minmax(82px, 1fr)
          27px
          27px
          34px
          25px
          25px;
      }


      .rushing-grid,
      .receiving-grid,
      .tightends-grid {
        grid-template-columns:
          27px
          minmax(86px, 1fr)
          30px
          35px
          26px
          32px;
      }


      .center-grid {
        grid-template-columns:
          27px
          minmax(100px, 1fr)
          37px
          37px
          37px;
      }


      .defensiveends-grid,
      .linebackers-grid,
      .secondary-grid {
        grid-template-columns:
          27px
          minmax(76px, 1fr)
          28px
          28px
          31px
          28px
          28px;
      }


      .kicking-grid {
        grid-template-columns:
          27px
          minmax(88px, 1fr)
          32px
          32px
          32px
          32px;
      }

    }

  </style>

</head>


<body>

  <div class="stats-divider"></div>



  <!-- =====================================================

  ===================================================== -->

  </section>



  <div class="stats-info">
    HSFL Season 2 statistics. Player totals will update as
    league games are completed and official stats are entered.
  </div>


</main>

<script>

  /* =====================================================
     REAL PLAYER STATS GO HERE LATER
  ===================================================== */

  const playerStats = {

    passing: [],

    rushing: [],

    receiving: [],

    tightends: [],

    center: [],

    defensiveends: [],

    linebackers: [],

    secondary: [],

    kicking: []

  };



  /* =====================================================
     CATEGORY SETTINGS
  ===================================================== */

  const categories = {

    passing: {

      title: "passing stats",

      grid: "passing-grid",

      headers: [
        "#",
        "PLAYER",
        "CMP",
        "ATT",
        "YDS",
        "TD",
        "INT"
      ],

      fields: [
        "completions",
        "attempts",
        "yards",
        "touchdowns",
        "interceptions"
      ],

      sortBy: "yards"

    },


    rushing: {

      title: "rushing stats",

      grid: "rushing-grid",

      headers: [
        "#",
        "PLAYER",
        "ATT",
        "YDS",
        "TD",
        "AVG"
      ],

      fields: [
        "attempts",
        "yards",
        "touchdowns",
        "average"
      ],

      sortBy: "yards"

    },


    receiving: {

      title: "receiving stats",

      grid: "receiving-grid",

      headers: [
        "#",
        "PLAYER",
        "REC",
        "YDS",
        "TD",
        "AVG"
      ],

      fields: [
        "receptions",
        "yards",
        "touchdowns",
        "average"
      ],

      sortBy: "yards"

    },


    tightends: {

      title: "tight ends stats",

      grid: "tightends-grid",

      headers: [
        "#",
        "PLAYER",
        "REC",
        "YDS",
        "TD",
        "AVG"
      ],

      fields: [
        "receptions",
        "yards",
        "touchdowns",
        "average"
      ],

      sortBy: "yards"

    },


    center: {

      title: "center stats",

      grid: "center-grid",

      headers: [
        "#",
        "PLAYER",
        "GP",
        "PTS",
        "GRADE"
      ],

      fields: [
        "games",
        "points",
        "grade"
      ],

      sortBy: "points"

    },


    defensiveends: {

      title: "defensive ends stats",

      grid: "defensiveends-grid",

      headers: [
        "#",
        "PLAYER",
        "TKL",
        "TFL",
        "SACK",
        "INT",
        "PBU"
      ],

      fields: [
        "tackles",
        "tfl",
        "sacks",
        "interceptions",
        "pbu"
      ],

      sortBy: "tackles"

    },


    linebackers: {

      title: "linebackers stats",

      grid: "linebackers-grid",

      headers: [
        "#",
        "PLAYER",
        "TKL",
        "TFL",
        "SACK",
        "INT",
        "PBU"
      ],

      fields: [
        "tackles",
        "tfl",
        "sacks",
        "interceptions",
        "pbu"
      ],

      sortBy: "tackles"

    },


    secondary: {

      title: "secondary stats",

      grid: "secondary-grid",

      headers: [
        "#",
        "PLAYER",
        "TKL",
        "INT",
        "PBU",
        "TFL",
        "TD"
      ],

      fields: [
        "tackles",
        "interceptions",
        "pbu",
        "tfl",
        "touchdowns"
      ],

      sortBy: "interceptions"

    },


    kicking: {

      title: "kicking stats",

      grid: "kicking-grid",

      headers: [
        "#",
        "PLAYER",
        "FGM",
        "FGA",
        "XP",
        "PTS"
      ],

      fields: [
        "fieldGoalsMade",
        "fieldGoalsAttempted",
        "extraPoints",
        "points"
      ],

      sortBy: "points"

    }

  };



  let currentCategory =
    "passing";



  const categoryTitle =
    document.getElementById(
      "categoryTitle"
    );


  const statsTable =
    document.getElementById(
      "statsTable"
    );


  const statsSearch =
    document.getElementById(
      "statsSearch"
    );


  const tabs =
    document.querySelectorAll(
      ".stats-tab"
    );



  /* =====================================================
     TABLE HEADER
  ===================================================== */

  function makeHeader(category) {

    const header =
      document.createElement(
        "div"
      );


    header.className =
      `stats-table-header ${category.grid}`;


    category.headers.forEach(
      text => {

        const item =
          document.createElement(
            "span"
          );


        item.textContent =
          text;


        header.appendChild(
          item
        );

      }
    );


    return header;

  }



  /* =====================================================
     PLAYER ROW
  ===================================================== */

  function makePlayerRow(
    player,
    rank,
    category
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      `stats-row ${category.grid}`;


    const values =
      category.fields.map(
        field => {

          const value =
            player[field];


          return value ?? 0;

        }
      );


    row.innerHTML = `

      <div class="stats-rank">
        ${rank}
      </div>


      <div class="stats-player">

        <span class="stats-player-name">
          ${player.name}
        </span>

        <span class="stats-player-team">
          ${player.team}
        </span>

      </div>


      ${values.map(
        value => `

          <span class="stats-number">
            ${value}
          </span>

        `
      ).join("")}

    `;


    return row;

  }



  /* =====================================================
     LOAD CATEGORY
  ===================================================== */

  function loadCategory(
    categoryName
  ) {

    currentCategory =
      categoryName;


    const category =
      categories[
        categoryName
      ];


    categoryTitle.textContent =
      category.title;


    tabs.forEach(
      tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.category ===
          categoryName
        );

      }
    );


    renderPlayers();

  }



  /* =====================================================
     RENDER PLAYERS
  ===================================================== */

  function renderPlayers() {

    const category =
      categories[
        currentCategory
      ];


    let players =
      [
        ...playerStats[
          currentCategory
        ]
      ];


    const search =
      statsSearch.value
        .trim()
        .toLowerCase();


    if (search) {

      players =
        players.filter(
          player => {

            const playerName =
              String(
                player.name || ""
              ).toLowerCase();


            const teamName =
              String(
                player.team || ""
              ).toLowerCase();


            return (
              playerName.includes(
                search
              ) ||
              teamName.includes(
                search
              )
            );

          }
        );

    }


    players.sort(
      (a, b) => {

        return (
          Number(
            b[category.sortBy] || 0
          ) -
          Number(
            a[category.sortBy] || 0
          )
        );

      }
    );


    statsTable.innerHTML =
      "";


    if (
      players.length === 0
    ) {

      statsTable.innerHTML = `

        <div class="stats-empty">
          No ${category.title} available yet.
        </div>

      `;


      return;

    }


    statsTable.appendChild(
      makeHeader(
        category
      )
    );


    players.forEach(
      (player, index) => {

        statsTable.appendChild(
          makePlayerRow(
            player,
            index + 1,
            category
          )
        );

      }
    );

  }



  /* =====================================================
     CATEGORY BUTTONS
  ===================================================== */

  tabs.forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          statsSearch.value =
            "";


          loadCategory(
            tab.dataset.category
          );

        }
      );

    }
  );



  /* =====================================================
     SEARCH
  ===================================================== */

  statsSearch.addEventListener(
    "input",
    renderPlayers
  );



  /* =====================================================
     START
  ===================================================== */

  loadCategory(
    "passing"
  );

</script>


</body>

</html>
