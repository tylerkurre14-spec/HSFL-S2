<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSFL Stats</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #e62c47;
  --page: #f4f5f7;
  --border: #dfdfe1;
  --text: #202127;
  --muted: #8e8f94;
}

body {
  margin: 0;
  padding-bottom: 100px;

  background: var(--page);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.page {
  width: 100%;
  max-width: 850px;

  margin: 0 auto;

  padding: 18px 10px 30px;
}

h1 {
  margin: 3px 3px 15px;

  font-size: 31px;
  font-weight: 950;

  letter-spacing: -1.4px;
}

.category-wrap {
  margin-bottom: 12px;

  display: flex;

  gap: 7px;

  overflow-x: auto;

  scrollbar-width: none;
}

.category-wrap::-webkit-scrollbar {
  display: none;
}

.category {
  flex: 0 0 auto;

  min-height: 38px;

  padding: 0 13px;

  border: 1px solid var(--border);
  border-radius: 999px;

  background: white;
  color: #77787e;

  font-size: 8px;
  font-weight: 950;
}

.category.active {
  background: var(--red);
  border-color: var(--red);

  color: white;
}

.search-card {
  margin-bottom: 12px;

  padding: 10px;

  background: white;

  border: 1px solid var(--border);
  border-radius: 15px;
}

.search {
  width: 100%;
  height: 43px;

  padding: 0 13px;

  outline: none;

  border: 1px solid #dddddf;
  border-radius: 10px;

  background: #f7f7f8;

  font-size: 10px;
  font-weight: 800;
}

.stats-card {
  overflow: hidden;

  background: white;

  border: 1px solid var(--border);
  border-radius: 18px;
}

.stats-header {
  min-height: 58px;

  padding: 0 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: white;

  background:
    linear-gradient(
      90deg,
      #94131d,
      #c32032,
      #e94152
    );
}

.stats-header strong {
  font-size: 15px;
  font-weight: 950;
}

.stats-header span {
  font-size: 8px;
  font-weight: 850;

  opacity: .8;
}

.table-wrap {
  width: 100%;

  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 620px;

  border-collapse: collapse;
}

th {
  height: 42px;

  padding: 0 8px;

  background: #f6f6f7;
  color: #96979c;

  border-bottom: 1px solid #dedee0;

  text-align: center;

  font-size: 7px;
  font-weight: 950;
}

th:nth-child(2) {
  text-align: left;
}

td {
  height: 50px;

  padding: 5px 8px;

  border-bottom: 1px solid #e6e6e7;

  text-align: center;

  font-size: 8px;
  font-weight: 900;
}

.player-cell {
  min-width: 150px;

  text-align: left;
}

.player-cell strong {
  display: block;

  font-size: 9px;
  font-weight: 950;
}

.player-cell span {
  display: block;

  margin-top: 2px;

  color: #929399;

  font-size: 7px;
  font-weight: 800;
}

.empty {
  padding: 38px 15px;

  text-align: center;

  color: var(--muted);

  font-size: 9px;
  font-weight: 850;
}

.bottom-nav {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  width: calc(100% - 24px);
  max-width: 520px;

  height: 67px;

  z-index: 1000;

  padding: 6px;

  display: grid;
  grid-template-columns: repeat(5,1fr);

  background: rgba(255,255,255,.97);

  border: 1px solid #ddd;
  border-radius: 999px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);
}

.nav-item {
  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 999px;

  color: #929399;

  font-size: 7px;
  font-weight: 900;
}

.nav-icon {
  font-size: 17px;
  line-height: 1;
}

.nav-item.active {
  background: var(--red);
  color: white;
}

</style>
</head>


<body>

<main class="page">

  <h1>
    Stats
  </h1>


  <div
    class="category-wrap"
    id="categories"
  ></div>


  <div class="search-card">

    <input
      class="search"
      id="search"
      placeholder="Search player or team..."
    >

  </div>


  <section class="stats-card">

    <div class="stats-header">

      <strong id="categoryTitle">
        PASSING
      </strong>

      <span>
        SEASON 2
      </span>

    </div>


    <div class="table-wrap">

      <table>

        <thead id="statsHead"></thead>

        <tbody id="statsBody"></tbody>

      </table>

    </div>

  </section>

</main>



<nav class="bottom-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <div class="nav-icon">⌂</div>
    Home
  </a>

  <a
    class="nav-item"
    href="standings.html"
  >
    <div class="nav-icon">≡</div>
    Standings
  </a>

  <a
    class="nav-item"
    href="scores.html"
  >
    <div class="nav-icon">▣</div>
    Scores
  </a>

  <a
    class="nav-item active"
    href="stats.html"
  >
    <div class="nav-icon">▥</div>
    Stats
  </a>

  <a
    class="nav-item"
    href="more.html"
  >
    <div class="nav-icon">•••</div>
    More
  </a>

</nav>



<script>

const SUPABASE_URL =
  "https://btjpzkgblmuetsomnvpw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9FmVKyCrGSsBbu3LIni6eQ_U95Fl0Vj";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const categories = {

  passing: {
    label: "PASSING",
    fields: [
      "CMP",
      "ATT",
      "YDS",
      "TD",
      "INT"
    ],
    sort: "YDS"
  },

  rushing: {
    label: "RUSHING",
    fields: [
      "ATT",
      "YDS",
      "TD",
      "AVG"
    ],
    sort: "YDS"
  },

  receiving: {
    label: "RECEIVING",
    fields: [
      "REC",
      "YDS",
      "TD",
      "AVG"
    ],
    sort: "YDS"
  },

  tightends: {
    label: "TIGHT ENDS",
    fields: [
      "REC",
      "YDS",
      "TD",
      "AVG"
    ],
    sort: "YDS"
  },

  center: {
    label: "CENTER",
    fields: [
      "GP",
      "PTS",
      "GRADE"
    ],
    sort: "GRADE"
  },

  defensiveends: {
    label: "DEFENSIVE ENDS",
    fields: [
      "TKL",
      "TFL",
      "SACK",
      "INT",
      "PBU"
    ],
    sort: "TKL"
  },

  linebackers: {
    label: "LINEBACKERS",
    fields: [
      "TKL",
      "TFL",
      "SACK",
      "INT",
      "PBU"
    ],
    sort: "TKL"
  },

  secondary: {
    label: "SECONDARY",
    fields: [
      "TKL",
      "INT",
      "PBU",
      "TFL",
      "TD"
    ],
    sort: "TKL"
  },

  kicking: {
    label: "KICKING",
    fields: [
      "FGM",
      "FGA",
      "XP",
      "PTS"
    ],
    sort: "PTS"
  }

};


let selectedCategory =
  "passing";

let players =
  {};

let teams =
  {};

let statRows =
  [];



function safe(
  value
) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  );

}



function renderCategories() {

  document.getElementById(
    "categories"
  ).innerHTML =
    Object.entries(
      categories
    )
    .map(
      ([key,category]) => `

        <button
          class="category ${
            key === selectedCategory
              ? "active"
              : ""
          }"
          data-category="${key}"
        >
          ${category.label}
        </button>

      `
    )
    .join("");


  document
  .querySelectorAll(
    "[data-category]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          selectedCategory =
            button.dataset.category;


          renderCategories();

          renderStats();

        }
      );

    }
  );

}



function aggregateCategory() {

  const category =
    categories[
      selectedCategory
    ];


  const grouped =
    {};


  statRows
    .filter(
      row =>
        row.category ===
        selectedCategory
    )
    .forEach(
      row => {

        const playerId =
          Number(
            row.player_id
          );


        if (
          !grouped[playerId]
        ) {

          grouped[playerId] = {

            playerId,

            totals: {},

            gradeTotal: 0,

            gradeCount: 0

          };


          category.fields.forEach(
            field => {

              grouped[
                playerId
              ].totals[field] =
                0;

            }
          );

        }


        const statData =
          row.stat_data
          ||
          {};


        category.fields.forEach(
          field => {

            const value =
              Number(
                statData[field]
                ||
                0
              );


            if (
              selectedCategory ===
              "center"
              &&
              field ===
              "GRADE"
            ) {

              if (
                statData[field] !== undefined
              ) {

                grouped[
                  playerId
                ].gradeTotal +=
                  value;


                grouped[
                  playerId
                ].gradeCount++;

              }

            }

            else if (
              field !== "AVG"
            ) {

              grouped[
                playerId
              ].totals[field] +=
                value;

            }

          }
        );

      }
    );


  return Object.values(
    grouped
  )
  .map(
    row => {

      if (
        selectedCategory ===
        "rushing"
      ) {

        row.totals.AVG =
          row.totals.ATT
          ? (
              row.totals.YDS /
              row.totals.ATT
            )
            .toFixed(1)
          : "0.0";

      }


      if (
        selectedCategory ===
        "receiving"
        ||
        selectedCategory ===
        "tightends"
      ) {

        row.totals.AVG =
          row.totals.REC
          ? (
              row.totals.YDS /
              row.totals.REC
            )
            .toFixed(1)
          : "0.0";

      }


      if (
        selectedCategory ===
        "center"
      ) {

        row.totals.GRADE =
          row.gradeCount
          ? (
              row.gradeTotal /
              row.gradeCount
            )
            .toFixed(1)
          : "0.0";

      }


      return row;

    }
  )
  .sort(
    (a,b) => {

      const sortField =
        category.sort;


      return (
        Number(
          b.totals[
            sortField
          ]
          ||
          0
        )
        -
        Number(
          a.totals[
            sortField
          ]
          ||
          0
        )
      );

    }
  );

}



function renderStats() {

  const category =
    categories[
      selectedCategory
    ];


  const search =
    document.getElementById(
      "search"
    )
    .value
    .trim()
    .toLowerCase();


  document.getElementById(
    "categoryTitle"
  ).textContent =
    category.label;


  document.getElementById(
    "statsHead"
  ).innerHTML = `

    <tr>

      <th>#</th>

      <th>
        PLAYER
      </th>

      ${
        category.fields
        .map(
          field => `
            <th>
              ${field}
            </th>
          `
        )
        .join("")
      }

    </tr>

  `;


  let rows =
    aggregateCategory();


  if (
    search
  ) {

    rows =
      rows.filter(
        row => {

          const player =
            players[
              row.playerId
            ];


          if (
            !player
          ) {

            return false;

          }


          const team =
            teams[
              player.team_slug
            ];


          const text =
            `
              ${player.roblox_username}
              ${player.display_name || ""}
              ${team?.name || ""}
              ${team?.short || ""}
            `
            .toLowerCase();


          return text.includes(
            search
          );

        }
      );

  }


  const body =
    document.getElementById(
      "statsBody"
    );


  if (
    !rows.length
  ) {

    body.innerHTML = `

      <tr>

        <td
          colspan="${category.fields.length + 2}"
        >

          <div class="empty">
            No ${category.label.toLowerCase()} stats entered yet.
          </div>

        </td>

      </tr>

    `;

    return;

  }


  body.innerHTML =
    rows
    .map(
      (row,index) => {

        const player =
          players[
            row.playerId
          ];


        if (
          !player
        ) {

          return "";

        }


        const team =
          teams[
            player.team_slug
          ];


        return `

          <tr>

            <td>
              ${index + 1}
            </td>


            <td class="player-cell">

              <strong>
                ${
                  safe(
                    player.display_name
                    ||
                    player.roblox_username
                  )
                }
              </strong>

              <span>

                @${safe(player.roblox_username)}

                ·

                ${safe(team?.short || "")}

              </span>

            </td>


            ${
              category.fields
              .map(
                field => `

                  <td>
                    ${row.totals[field] ?? 0}
                  </td>

                `
              )
              .join("")
            }

          </tr>

        `;

      }
    )
    .join("");

}



document.getElementById(
  "search"
)
.addEventListener(
  "input",
  renderStats
);



async function loadStats() {

  const [
    teamResult,
    playerResult,
    statsResult
  ] =
    await Promise.all([

      sb
        .from("hsfl_teams")
        .select("*")
        .eq("active",true),

      sb
        .from("hsfl_players")
        .select("*")
        .eq("active",true),

      sb
        .from("hsfl_player_game_stats")
        .select("*")
        .eq("season",2)

    ]);


  if (
    teamResult.error
    ||
    playerResult.error
    ||
    statsResult.error
  ) {

    document.getElementById(
      "statsBody"
    ).innerHTML = `

      <tr>
        <td>
          Could not load stats.
        </td>
      </tr>

    `;

    return;

  }


  teams = {};


  teamResult.data.forEach(
    team => {

      teams[
        team.slug
      ] =
        team;

    }
  );


  players = {};


  playerResult.data.forEach(
    player => {

      players[
        Number(player.id)
      ] =
        player;

    }
  );


  statRows =
    statsResult.data
    ||
    [];


  renderCategories();

  renderStats();

}


loadStats();

</script>

</body>
</html>
