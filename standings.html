<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Standings | HSFL S2</title>

  <link rel="stylesheet" href="style.css">


  <style>

    /* =====================================================
       STANDINGS PAGE ONLY
       THIS OVERRIDES THE BIG ROWS IN style.css
    ===================================================== */

    .standings-page {
      padding-top: 18px;
    }


    .standings-page-title {
      margin: 0 4px 16px;

      font-size: 30px;
      font-weight: 900;

      letter-spacing: -1px;
    }


    /* =====================================================
       TOP STANDINGS / PLAYOFF TABS
    ===================================================== */

    .standings-top-tabs {
      width: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 5px;

      padding: 5px;

      margin-bottom: 22px;

      background: #fff;

      border: 1px solid #d8d8d8;
      border-radius: 999px;
    }


    .standings-top-tab {
      height: 47px;

      padding: 0 12px;

      border: 0;
      border-radius: 999px;

      background: transparent;

      color: #555;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }


    .standings-top-tab.active {
      background: #e62c47;
      color: #fff;
    }


    /* =====================================================
       BOTH / AMERICAN / NATIONAL
    ===================================================== */

    .conference-tabs {
      display: flex;

      gap: 8px;

      margin-bottom: 20px;
    }


    .conference-tab {
      flex: 1;

      height: 47px;

      padding: 0 8px;

      border: 1.5px solid #d7d7d7;
      border-radius: 999px;

      background: #fff;

      color: #24242a;

      font-size: 11px;
      font-weight: 900;

      cursor: pointer;
    }


    .conference-tab.active {
      background: #1f2026;
      border-color: #1f2026;
      color: #fff;
    }


    /* =====================================================
       CONFERENCE CARD
    ===================================================== */

    .full-conference-card {
      width: 100%;

      margin-bottom: 20px;

      overflow: hidden;

      background: #fff;

      border: 1px solid #d7d7d7;
      border-radius: 19px;
    }


    .full-conference-card[hidden] {
      display: none;
    }


    /* =====================================================
       RED CONFERENCE HEADER
       DARK LEFT -> LIGHT RIGHT
    ===================================================== */

    .conference-card-title {
      min-height: 65px;

      padding: 0 17px;

      display: flex;
      align-items: center;

      gap: 10px;

      background:
        linear-gradient(
          90deg,
          #9b141f 0%,
          #b61d29 35%,
          #cf2938 70%,
          #df3948 100%
        );

      color: #fff;
    }


    .conference-card-title strong {
      font-size: 16px;
      font-weight: 900;
    }


    .conference-card-title span {
      color: rgba(255,255,255,.92);

      font-size: 12px;
      font-weight: 500;
    }


    /* =====================================================
       COLUMN HEADER
       ALSO THINNER
    ===================================================== */

    .full-standing-header {
      min-height: 46px;

      display: grid;

      grid-template-columns:
        38px
        minmax(0,1fr)
        31px
        31px
        39px;

      align-items: center;

      padding: 0 7px;

      background: #fff;

      border-bottom: 1px solid #d8d8d8;

      color: #b9b9bc;

      font-size: 9px;
      font-weight: 900;
    }


    .full-standing-header span:first-child {
      text-align: center;
    }


    .full-standing-header span:nth-child(n+3) {
      text-align: center;
    }


    /* =====================================================
       PLAYOFF SECTION BARS
    ===================================================== */

    .standings-zone {
      width: 100%;

      height: 38px;
      min-height: 38px;

      display: flex;
      align-items: center;

      padding: 0 15px;

      color: #fff;

      font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: .2px;

      text-transform: uppercase;
    }


    .standings-zone.top-zone {
      background:
        linear-gradient(
          90deg,
          #3d9958 0%,
          #4ca562 50%,
          #63b673 100%
        );
    }


    .standings-zone.wildcard-zone {
      background:
        linear-gradient(
          90deg,
          #ad791c 0%,
          #c18a27 50%,
          #d39c34 100%
        );
    }


    .standings-zone.hunt-zone {
      background:
        linear-gradient(
          90deg,
          #999999 0%,
          #aaaaaa 50%,
          #bdbdbd 100%
        );
    }


    /* =====================================================
       THE IMPORTANT FIX
       THIN TEAM ROWS LIKE AFL
    ===================================================== */

    .full-standing-row {
      height: 52px;
      min-height: 52px;

      display: grid;

      grid-template-columns:
        38px
        minmax(0,1fr)
        31px
        31px
        39px;

      align-items: center;

      padding: 0 7px;

      background: #fff;

      border-bottom: 1px solid #dddddd;
    }


    .full-standing-row:last-child {
      border-bottom: 0;
    }


    .full-standing-row > b {
      text-align: center;

      color: #202127;

      font-size: 11px;
      font-weight: 900;
    }


    /* =====================================================
       SMALL AFL-STYLE RANK CIRCLE
    ===================================================== */

    .standing-rank {
      width: 29px;
      height: 29px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #fff;

      font-size: 10px;
      font-weight: 900;
    }


    .standing-rank.rank-top {
      background: #48a463;
    }


    .standing-rank.rank-wildcard {
      background: #c88e27;
    }


    .standing-rank.rank-hunt {
      background: #adadad;
    }


    /* =====================================================
       TEAM INFO
    ===================================================== */

    .full-standing-team {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 7px;
    }


    .full-standing-team strong {
      min-width: 0;

      color: #202127;

      font-size: 10px;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =====================================================
       SMALLER RECTANGLE TEAM LOGOS
    ===================================================== */

    .full-standing-logo {
      width: 46px;
      height: 29px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 1px;
    }


    .full-standing-logo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transform: scale(1.08);
    }


    /* =====================================================
       PLAYOFF PAGE
    ===================================================== */

    .playoff-section[hidden] {
      display: none;
    }


    .playoff-heading {
      margin-bottom: 17px;
    }


    .playoff-small-title {
      color: #e62c47;

      font-size: 9px;
      font-weight: 900;
    }


    .playoff-heading h1 {
      margin: 5px 0;

      font-size: 26px;
      font-weight: 900;
    }


    .playoff-heading p {
      margin: 7px 0 0;

      color: #777;

      font-size: 10px;
      line-height: 1.4;
    }


    /* =====================================================
       VERY SMALL PHONE
    ===================================================== */

    @media (max-width: 390px) {

      .full-standing-header,
      .full-standing-row {

        grid-template-columns:
          34px
          minmax(0,1fr)
          28px
          28px
          35px;

        padding-left: 5px;
        padding-right: 5px;
      }


      .full-standing-row {
        height: 49px;
        min-height: 49px;
      }


      .standing-rank {
        width: 27px;
        height: 27px;

        font-size: 9px;
      }


      .full-standing-logo {
        width: 42px;
        height: 27px;

        flex-basis: 42px;
      }


      .full-standing-team {
        gap: 5px;
      }


      .full-standing-team strong {
        font-size: 9px;
      }


      .full-standing-row > b {
        font-size: 10px;
      }

    }

  </style>

</head>



<body>


<main class="app standings-page">

    Standings
  </div>

    <!-- NATIONAL -->

    <div

  <!-- =====================================================

  <section

      <span class="playoff-small-title">

      </span>

        PLAYOFF PICTURE
      </h1>

      <p>
        Top four teams from each conference
        currently hold a playoff spot.
      </p>

    </div>



    <div class="full-conference-card">

      <div class="conference-card-title">

        <strong>
          AMERICAN
        </strong>

        <span>
          PLAYOFF PICTURE
        </span>

      </div>


      <div class="full-standing-header">

        <span>#</span>
        <span>TEAM</span>
        <span>W</span>
        <span>L</span>
        <span>PD</span>

      </div>


      <div id="americanPlayoffBody"></div>

    </div>



    <div class="full-conference-card">

      <div class="conference-card-title">

        <strong>
          NATIONAL
        </strong>

        <span>
          PLAYOFF PICTURE
        </span>

      </div>


      <div class="full-standing-header">

        <span>#</span>
        <span>TEAM</span>
        <span>W</span>
        <span>L</span>
        <span>PD</span>

      </div>


      <div id="nationalPlayoffBody"></div>

    </div>


  </section>

<script>

  /* =====================================================
     TEAM DATA
  ===================================================== */

  const standingsTeams = {

    auburn: {
      name: "AUBURN TIGERS",
      logo: "auburn.png.PNG",
      className: "auburn",
      wins: 0,
      losses: 0,
      pd: 0
    },


    parker: {
      name: "PARKER THUNDERING HERD",
      logo: "parker.png.PNG.PNG",
      className: "parker",
      wins: 0,
      losses: 0,
      pd: 0
    },


    cornercanyon: {
      name: "CORNER CANYON",
      logo: "chargers.png.PNG",
      className: "chargers",
      wins: 0,
      losses: 0,
      pd: 0
    },


    stfrances: {
      name: "ST. FRANCES ACADEMY",
      logo: "stfrances.png.PNG",
      className: "stfrances",
      wins: 0,
      losses: 0,
      pd: 0
    },


    buford: {
      name: "BUFORD WOLVES",
      logo: "buford.png.PNG",
      className: "buford",
      wins: 0,
      losses: 0,
      pd: 0
    },


    bosco: {
      name: "ST. JOHN BOSCO",
      logo: "bosco.png.PNG",
      className: "bosco",
      wins: 0,
      losses: 0,
      pd: 0
    },


    centennial: {
      name: "CENTENNIAL HUSKIES",
      logo: "centennial.png.PNG",
      className: "centennial",
      wins: 0,
      losses: 0,
      pd: 0
    },


    img: {
      name: "IMG ACADEMY",
      logo: "img.png.PNG",
      className: "imgacademy",
      wins: 0,
      losses: 0,
      pd: 0
    },


    norland: {
      name: "NORLAND VIKINGS",
      logo: "norland.png.PNG",
      className: "norland",
      wins: 0,
      losses: 0,
      pd: 0
    },


    saraland: {
      name: "SARALAND SPARTANS",
      logo: "saraland.png.PNG",
      className: "saraland",
      wins: 0,
      losses: 0,
      pd: 0
    },


    mckinney: {
      name: "MCKINNEY LIONS",
      logo: "mckinney.png.PNG",
      className: "mckinney",
      wins: 0,
      losses: 0,
      pd: 0
    },


    guyer: {
      name: "DENTON GUYER WILDCATS",
      logo: "guyer.png.PNG",
      className: "guyer",
      wins: 0,
      losses: 0,
      pd: 0
    }

  };



  const americanTeams = [

    "auburn",
    "parker",
    "cornercanyon",
    "stfrances",
    "buford",
    "bosco"

  ];


  const nationalTeams = [

    "centennial",
    "img",
    "norland",
    "saraland",
    "mckinney",
    "guyer"

  ];



  function formatPD(number) {

    if (number > 0) {
      return "+" + number;
    }

    return number;

  }



  function rankTeams(teamIDs) {

    return [...teamIDs].sort(
      (a, b) => {

        const teamA =
          standingsTeams[a];


        const teamB =
          standingsTeams[b];


        if (
          teamB.wins !==
          teamA.wins
        ) {

          return (
            teamB.wins -
            teamA.wins
          );

        }


        if (
          teamA.losses !==
          teamB.losses
        ) {

          return (
            teamA.losses -
            teamB.losses
          );

        }


        if (
          teamB.pd !==
          teamA.pd
        ) {

          return (
            teamB.pd -
            teamA.pd
          );

        }


        return (
          teamIDs.indexOf(a) -
          teamIDs.indexOf(b)
        );

      }
    );

  }



  function createSectionLabel(
    type,
    text
  ) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      `standings-zone ${type}`;


    label.textContent =
      text;


    return label;

  }



  function createTeamRow(
    teamID,
    rank,
    zone
  ) {

    const team =
      standingsTeams[teamID];


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "full-standing-row";


    row.innerHTML = `

      <div
        class="standing-rank ${zone}"
      >
        ${rank}
      </div>


      <div class="full-standing-team">

        <div
          class="
            full-standing-logo
            ${team.className}
          "
        >

          <img
            src="${team.logo}"
            alt="${team.name}"
          >

        </div>


        <strong>
          ${team.name}
        </strong>

      </div>


      <b>
        ${team.wins}
      </b>


      <b>
        ${team.losses}
      </b>


      <b>
        ${formatPD(team.pd)}
      </b>

    `;


    return row;

  }



  function buildStandings(
    teamIDs,
    containerID
  ) {

    const container =
      document.getElementById(
        containerID
      );


    container.innerHTML = "";


    const rankedTeams =
      rankTeams(teamIDs);


    rankedTeams.forEach(
      (teamID, index) => {

        const rank =
          index + 1;


        if (rank === 1) {

          container.appendChild(
            createSectionLabel(
              "top-zone",
              "TOP 2"
            )
          );

        }


        if (rank === 3) {

          container.appendChild(
            createSectionLabel(
              "wildcard-zone",
              "WILD CARD"
            )
          );

        }


        if (rank === 5) {

          container.appendChild(
            createSectionLabel(
              "hunt-zone",
              "IN THE HUNT"
            )
          );

        }


        let zone;


        if (rank <= 2) {

          zone =
            "rank-top";

        }

        else if (rank <= 4) {

          zone =
            "rank-wildcard";

        }

        else {

          zone =
            "rank-hunt";

        }


        container.appendChild(
          createTeamRow(
            teamID,
            rank,
            zone
          )
        );

      }
    );

  }



  function buildPlayoffs(
    teamIDs,
    containerID
  ) {

    const container =
      document.getElementById(
        containerID
      );


    container.innerHTML = "";


    const ranked =
      rankTeams(teamIDs)
        .slice(0,4);


    ranked.forEach(
      (teamID, index) => {

        const rank =
          index + 1;


        if (rank === 1) {

          container.appendChild(
            createSectionLabel(
              "top-zone",
              "TOP 2"
            )
          );

        }


        if (rank === 3) {

          container.appendChild(
            createSectionLabel(
              "wildcard-zone",
              "WILD CARD"
            )
          );

        }


        container.appendChild(
          createTeamRow(
            teamID,
            rank,
            rank <= 2
              ? "rank-top"
              : "rank-wildcard"
          )
        );

      }
    );

  }



  buildStandings(
    americanTeams,
    "americanStandingsBody"
  );


  buildStandings(
    nationalTeams,
    "nationalStandingsBody"
  );


  buildPlayoffs(
    americanTeams,
    "americanPlayoffBody"
  );


  buildPlayoffs(
    nationalTeams,
    "nationalPlayoffBody"
  );



  /* CONFERENCE SWITCH */

  const conferenceTabs =
    document.querySelectorAll(
      ".conference-tab"
    );


  const americanStandings =
    document.getElementById(
      "americanStandings"
    );


  const nationalStandings =
    document.getElementById(
      "nationalStandings"
    );


  conferenceTabs.forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          conferenceTabs.forEach(
            button => {

              button.classList.remove(
                "active"
              );

            }
          );


          tab.classList.add(
            "active"
          );


          const view =
            tab.dataset.view;


          americanStandings.hidden =
            view === "national";


          nationalStandings.hidden =
            view === "american";

        }
      );

    }
  );



  /* STANDINGS / PLAYOFF SWITCH */

  const topTabs =
    document.querySelectorAll(
      ".standings-top-tab"
    );


  const standingsSection =
    document.getElementById(
      "fullStandingsSection"
    );


  const playoffSection =
    document.getElementById(
      "playoffSection"
    );


  topTabs.forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          topTabs.forEach(
            button => {

              button.classList.remove(
                "active"
              );

            }
          );


          tab.classList.add(
            "active"
          );


          const playoffs =
            tab.dataset.section ===
            "playoffs";


          standingsSection.hidden =
            playoffs;


          playoffSection.hidden =
            !playoffs;

        }
      );

    }
  );

</script>


</body>
