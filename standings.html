<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSFL Standings</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #e62c47;
  --red-dark: #9e1522;
  --red-mid: #c32134;
  --green: #36a766;
  --gold: #d5a431;
  --page: #f5f5f6;
  --card: #ffffff;
  --border: #e2e2e4;
  --text: #18191e;
  --muted: #85868c;
}

html {
  background: var(--page);
}

body {
  margin: 0;
  padding: 0 0 105px;

  background: var(--page);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
a {
  font-family: inherit;
}

button {
  cursor: pointer;
}


/* ==========================================
   PAGE
========================================== */

.page {
  width: 100%;
  max-width: 760px;

  margin: 0 auto;

  padding: 20px 11px 30px;
}

.page-title {
  margin: 2px 3px 17px;

  font-size: 34px;
  font-weight: 950;

  letter-spacing: -1.5px;
  line-height: 1;
}


/* ==========================================
   MAIN TABS
========================================== */

.top-tabs-wrap {
  width: 100%;

  margin-bottom: 13px;

  overflow-x: auto;

  scrollbar-width: none;
}

.top-tabs-wrap::-webkit-scrollbar {
  display: none;
}

.top-tabs {
  min-width: max-content;

  display: flex;

  gap: 7px;
}

.top-tab {
  height: 40px;

  padding: 0 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid #dedee0;
  border-radius: 999px;

  background: #fff;
  color: #65666c;

  font-size: 10px;
  font-weight: 900;

  text-decoration: none;

  white-space: nowrap;
}

.top-tab.active {
  background: var(--red);
  border-color: var(--red);

  color: #fff;
}


/* ==========================================
   CONFERENCE FILTERS
========================================== */

.filters {
  margin-bottom: 14px;

  display: flex;

  gap: 7px;
}

.filter {
  height: 36px;

  padding: 0 16px;

  border: 1px solid #dedee0;
  border-radius: 999px;

  background: #fff;
  color: #68696f;

  font-size: 10px;
  font-weight: 950;

  letter-spacing: .2px;
}

.filter.active {
  background: #1f2025;
  border-color: #1f2025;

  color: #fff;
}


/* ==========================================
   CONFERENCE CARD
========================================== */

.conference-card {
  overflow: hidden;

  margin-bottom: 16px;

  background: var(--card);

  border: 1px solid var(--border);
  border-radius: 20px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.025);
}

.conference-header {
  min-height: 65px;

  padding: 0 15px;

  display: flex;
  align-items: center;

  color: white;

  background:
    linear-gradient(
      90deg,
      #94141f 0%,
      #bd2132 53%,
      #e33b4d 100%
    );
}

.conference-header strong {
  font-size: 18px;
  font-weight: 950;

  letter-spacing: -.3px;
}


/* ==========================================
   COLUMN HEADER
========================================== */

.column-header {
  height: 46px;

  display: grid;

  grid-template-columns:
    35px
    minmax(0,1fr)
    38px
    38px
    49px;

  align-items: center;

  padding: 0 10px;

  background: #f7f7f8;
  color: #77787e;

  border-bottom: 1px solid #e6e6e7;

  font-size: 9px;
  font-weight: 950;

  letter-spacing: .2px;
}

.column-header span:not(:nth-child(2)) {
  text-align: center;
}


/* ==========================================
   ZONES
========================================== */

.zone {
  height: 38px;

  padding: 0 12px;

  display: flex;
  align-items: center;

  font-size: 9px;
  font-weight: 950;

  letter-spacing: .65px;
}

.zone.top {
  background: #eaf7ef;
  color: #268a50;
}

.zone.wild {
  background: #fff6dc;
  color: #9d7415;
}

.zone.hunt {
  background: #eeeeef;
  color: #66676c;
}


/* ==========================================
   STANDING ROWS
========================================== */

.standing-row {
  height: 54px;
  min-height: 54px;

  display: grid;

  grid-template-columns:
    35px
    minmax(0,1fr)
    38px
    38px
    49px;

  align-items: center;

  padding: 0 10px;

  border-bottom: 1px solid #ededee;

  background: white;
}

.standing-row:last-child {
  border-bottom: 0;
}


/* ==========================================
   RANK
========================================== */

.rank {
  width: 29px;
  height: 29px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #e7e7e8;
  color: #4d4e53;

  font-size: 10px;
  font-weight: 950;
}

.rank.top {
  background: var(--green);
  color: white;
}

.rank.wild {
  background: var(--gold);
  color: white;
}


/* ==========================================
   TEAM
========================================== */

.team-cell {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 8px;
}

.logo-box {
  width: 47px;
  height: 30px;

  flex: 0 0 auto;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 6px;

  background: #222;
}

.logo-box img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.team-name {
  min-width: 0;

  overflow: hidden;

  color: #202126;

  font-size: 10.5px;
  font-weight: 950;

  letter-spacing: -.12px;

  white-space: nowrap;
  text-overflow: ellipsis;
}

.number {
  text-align: center;

  color: #202126;

  font-size: 12px;
  font-weight: 950;
}


/* ==========================================
   EMPTY / ERROR
========================================== */

.empty {
  padding: 40px 15px;

  text-align: center;

  color: var(--muted);

  font-size: 11px;
  font-weight: 900;
}


/* ==========================================
   TEAM COLORS
========================================== */

.auburn {
  background: #123f76;
}

.parker {
  background: #151515;
}

.cornercanyon {
  background: #27323e;
}

.stfrances {
  background: #542772;
}

.buford {
  background: #147747;
}

.bosco {
  background: #142d54;
}

.centennial {
  background: #262626;
}

.imgacademy,
.img {
  background: #087bc1;
}

.norland {
  background: #7c1026;
}

.saraland {
  background: #b41529;
}

.mckinney {
  background: #173f78;
}

.guyer {
  background: #552a72;
}

.stjames {
  background: #17365f;
}

.dutchfork,
.silverfoxes {
  background: #000;
}


/* ==========================================
   BOTTOM NAV - UFL STYLE
========================================== */

.bottom-nav {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  width: calc(100% - 22px);
  max-width: 520px;

  height: 68px;

  z-index: 2000;

  padding: 6px;

  display: grid;
  grid-template-columns: repeat(5,1fr);

  background:
    rgba(255,255,255,.97);

  border: 1px solid #dddddf;
  border-radius: 999px;

  box-shadow:
    0 9px 28px
    rgba(0,0,0,.14);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.nav-item {
  min-width: 0;

  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 999px;

  color: #888990;

  font-size: 7.5px;
  font-weight: 900;

  transition:
    background .15s ease,
    color .15s ease;
}

.nav-item svg {
  width: 19px;
  height: 19px;

  display: block;

  fill: none;
  stroke: currentColor;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item.active {
  background: var(--red);
  color: white;
}


/* ==========================================
   SMALL PHONES
========================================== */

@media (max-width: 390px) {

  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .page-title {
    font-size: 32px;
  }

  .conference-header strong {
    font-size: 17px;
  }

  .standing-row {
    height: 52px;
    min-height: 52px;

    grid-template-columns:
      33px
      minmax(0,1fr)
      35px
      35px
      45px;

    padding-left: 8px;
    padding-right: 8px;
  }

  .column-header {
    grid-template-columns:
      33px
      minmax(0,1fr)
      35px
      35px
      45px;

    padding-left: 8px;
    padding-right: 8px;
  }

  .rank {
    width: 27px;
    height: 27px;
  }

  .logo-box {
    width: 44px;
    height: 28px;
  }

  .team-name {
    font-size: 10px;
  }

  .number {
    font-size: 11.5px;
  }

}

</style>
</head>


<body>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://btjpzkgblmuetsomnvpw.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_9FmVKyCrGSsBbu3LIni6eQ_U95Fl0Vj";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ==========================================
   DATA
========================================== */

let teams =
  [];


let games =
  [];


let overrides =
  {};


let selectedFilter =
  "both";



/* ==========================================
   RECORD CALCULATION
========================================== */

function calculateRecords() {

  const records =
    {};


  teams.forEach(
    team => {

      records[
        team.slug
      ] = {

        wins: 0,

        losses: 0,

        pd: 0

      };

    }
  );


  games.forEach(
    game => {

      if (
        game.status !==
        "final"
        &&
        game.status !==
        "forfeit"
      ) {

        return;

      }


      if (
        game.away_score ===
        null
        ||
        game.home_score ===
        null
      ) {

        return;

      }


      const away =
        records[
          game.away_team
        ];


      const home =
        records[
          game.home_team
        ];


      if (
        !away
        ||
        !home
      ) {

        return;

      }


      const awayScore =
        Number(
          game.away_score
        );


      const homeScore =
        Number(
          game.home_score
        );


      away.pd +=
        awayScore -
        homeScore;


      home.pd +=
        homeScore -
        awayScore;


      if (
        awayScore >
        homeScore
      ) {

        away.wins +=
          1;


        home.losses +=
          1;

      }


      else if (
        homeScore >
        awayScore
      ) {

        home.wins +=
          1;


        away.losses +=
          1;

      }

    }
  );



  Object.entries(
    overrides
  )
  .forEach(
    ([slug,row]) => {

      if (
        !records[
          slug
        ]
      ) {

        return;

      }


      if (
        row.wins !==
        null
      ) {

        records[
          slug
        ].wins =
          Number(
            row.wins
          );

      }


      if (
        row.losses !==
        null
      ) {

        records[
          slug
        ].losses =
          Number(
            row.losses
          );

      }


      if (
        row.pd !==
        null
      ) {

        records[
          slug
        ].pd =
          Number(
            row.pd
          );

      }

    }
  );


  return records;

}



/* ==========================================
   RANKING
========================================== */

function rankedTeams(
  conference
) {

  const records =
    calculateRecords();


  return teams

    .filter(
      team =>
        team.conference ===
        conference
    )

    .map(
      team => ({

        ...team,

        ...records[
          team.slug
        ]

      })
    )

    .sort(
      (a,b) => {

        if (
          b.wins !==
          a.wins
        ) {

          return (
            b.wins -
            a.wins
          );

        }


        if (
          a.losses !==
          b.losses
        ) {

          return (
            a.losses -
            b.losses
          );

        }


        if (
          b.pd !==
          a.pd
        ) {

          return (
            b.pd -
            a.pd
          );

        }


        return (
          Number(
            a.display_order
          )
          -
          Number(
            b.display_order
          )
        );

      }
    );

}



/* ==========================================
   RANK COLORS
========================================== */

function rankClass(
  rank
) {

  if (
    rank <=
    2
  ) {

    return "top";

  }


  if (
    rank <=
    4
  ) {

    return "wild";

  }


  return "";

}



/* ==========================================
   ROWS
========================================== */

function rowsHtml(
  list,
  start,
  end
) {

  return list

    .slice(
      start,
      end
    )

    .map(
      (
        team,
        index
      ) => {

        const rank =
          start +
          index +
          1;


        return `

          <div class="standing-row">

            <div
              class="rank ${rankClass(rank)}"
            >
              ${rank}
            </div>


            <div class="team-cell">

              <div
                class="logo-box ${team.class_name || team.slug}"
              >

                <img
                  src="${team.logo_path}"
                  alt="${team.name}"
                >

              </div>


              <div class="team-name">
                ${team.name}
              </div>

            </div>


            <div class="number">
              ${team.wins}
            </div>


            <div class="number">
              ${team.losses}
            </div>


            <div class="number">

              ${
                team.pd >
                0
                  ? "+"
                  : ""
              }

              ${team.pd}

            </div>

          </div>

        `;

      }
    )

    .join("");

}



/* ==========================================
   CONFERENCE
========================================== */

function conferenceHtml(
  conference,
  title
) {

  const list =
    rankedTeams(
      conference
    );


  if (
    !list.length
  ) {

    return "";

  }


  return `

    <section class="conference-card">

      <div class="conference-header">

        <strong>
          ${title}
        </strong>

      </div>


      <div class="column-header">

        <span>
          #
        </span>

        <span>
          TEAM
        </span>

        <span>
          W
        </span>

        <span>
          L
        </span>

        <span>
          PD
        </span>

      </div>



      <div class="zone top">
        TOP 2
      </div>

      ${rowsHtml(
        list,
        0,
        2
      )}



      <div class="zone wild">
        WILD CARD
      </div>

      ${rowsHtml(
        list,
        2,
        4
      )}



      <div class="zone hunt">
        IN THE HUNT
      </div>

      ${rowsHtml(
        list,
        4,
        6
      )}

    </section>

  `;

}



/* ==========================================
   RENDER
========================================== */

function renderStandings() {

  const container =
    document.getElementById(
      "standings"
    );


  let html =
    "";


  if (
    selectedFilter ===
    "both"
    ||
    selectedFilter ===
    "american"
  ) {

    html +=
      conferenceHtml(
        "american",
        "AMERICAN CONFERENCE"
      );

  }


  if (
    selectedFilter ===
    "both"
    ||
    selectedFilter ===
    "national"
  ) {

    html +=
      conferenceHtml(
        "national",
        "NATIONAL CONFERENCE"
      );

  }


  container.innerHTML =
    html
    ||
    `

      <div class="empty">
        No standings data yet.
      </div>

    `;

}



/* ==========================================
   FILTER BUTTONS
========================================== */

document
.querySelectorAll(
  "[data-filter]"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        selectedFilter =
          button.dataset.filter;


        document
        .querySelectorAll(
          "[data-filter]"
        )
        .forEach(
          item => {

            item.classList.toggle(
              "active",
              item ===
              button
            );

          }
        );


        renderStandings();

      }
    );

  }
);



/* ==========================================
   LOAD LIVE DATABASE
========================================== */

async function loadStandings() {

  const [

    teamResult,

    gameResult,

    overrideResult

  ] =
    await Promise.all([


      sb
        .from(
          "hsfl_teams"
        )
        .select("*")
        .eq(
          "active",
          true
        )
        .order(
          "display_order",
          {
            ascending: true
          }
        ),


      sb
        .from(
          "hsfl_games"
        )
        .select("*")
        .eq(
          "season",
          2
        ),


      sb
        .from(
          "hsfl_team_record_overrides"
        )
        .select("*")


    ]);


  if (
    teamResult.error
    ||
    gameResult.error
    ||
    overrideResult.error
  ) {

    document.getElementById(
      "standings"
    ).innerHTML = `

      <div class="empty">
        Could not load standings.
      </div>

    `;


    return;

  }



  teams =
    teamResult.data
    ||
    [];


  games =
    gameResult.data
    ||
    [];


  overrides =
    {};


  (
    overrideResult.data
    ||
    []
  )
  .forEach(
    row => {

      overrides[
        row.team_slug
      ] =
        row;

    }
  );


  renderStandings();

}


loadStandings();

</script>
