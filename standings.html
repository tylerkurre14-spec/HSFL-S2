<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSFL Standings</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #e62c47;
  --green: #34a867;
  --gold: #dca82d;
  --page: #f4f5f7;
  --border: #dfdfe1;
  --text: #202127;
  --muted: #909197;
}

body {
  margin: 0;
  padding-bottom: 100px;

  background: var(--page);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.page {
  width: 100%;
  max-width: 760px;

  margin: 0 auto;

  padding: 18px 10px 30px;
}

h1 {
  margin: 3px 3px 15px;

  font-size: 31px;
  font-weight: 950;

  letter-spacing: -1.4px;
}

.top-tabs {
  margin-bottom: 14px;

  display: flex;

  gap: 7px;

  overflow-x: auto;
}

.top-tab {
  flex: 0 0 auto;

  height: 38px;

  padding: 0 13px;

  display: flex;
  align-items: center;

  border-radius: 999px;

  background: white;

  border: 1px solid var(--border);

  color: #66676d;

  font-size: 8px;
  font-weight: 950;
}

.top-tab.active {
  background: var(--red);
  border-color: var(--red);

  color: white;
}

.filters {
  margin-bottom: 12px;

  display: flex;

  gap: 7px;
}

.filter {
  height: 34px;

  padding: 0 14px;

  border: 1px solid var(--border);
  border-radius: 999px;

  background: white;
  color: #77787e;

  font-size: 8px;
  font-weight: 950;
}

.filter.active {
  background: #222329;
  border-color: #222329;

  color: white;
}

.conference-card {
  overflow: hidden;

  margin-bottom: 14px;

  background: white;

  border: 1px solid var(--border);
  border-radius: 19px;
}

.conference-header {
  min-height: 61px;

  padding: 0 15px;

  display: flex;
  align-items: center;

  color: white;

  background:
    linear-gradient(
      90deg,
      #96141e,
      #c12032,
      #e84050
    );
}

.conference-header strong {
  font-size: 16px;
  font-weight: 950;
}

.column-header {
  height: 43px;

  display: grid;

  grid-template-columns:
    32px
    minmax(0,1fr)
    34px
    34px
    44px;

  align-items: center;

  padding: 0 9px;

  background: #f6f6f7;

  color: #97989d;

  font-size: 7px;
  font-weight: 950;
}

.column-header span:not(:nth-child(2)) {
  text-align: center;
}

.zone {
  min-height: 32px;

  padding: 0 11px;

  display: flex;
  align-items: center;

  font-size: 7px;
  font-weight: 950;

  letter-spacing: .5px;
}

.zone.top {
  background: #eaf7ef;
  color: #298c54;
}

.zone.wild {
  background: #fff7df;
  color: #a97c12;
}

.zone.hunt {
  background: #eeeeef;
  color: #77787d;
}

.row {
  min-height: 49px;

  display: grid;

  grid-template-columns:
    32px
    minmax(0,1fr)
    34px
    34px
    44px;

  align-items: center;

  padding: 0 9px;

  border-bottom: 1px solid #e8e8e9;
}

.row:last-child {
  border-bottom: 0;
}

.rank {
  width: 25px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #e3e3e5;

  color: #55565c;

  font-size: 8px;
  font-weight: 950;
}

.rank.top {
  background: #35a868;
  color: white;
}

.rank.wild {
  background: #d6a52c;
  color: white;
}

.team-cell {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 7px;
}

.logo-box {
  width: 43px;
  height: 27px;

  flex: 0 0 auto;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 6px;

  background: #222;
}

.logo-box img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.team-name {
  min-width: 0;

  font-size: 8px;
  font-weight: 950;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.number {
  text-align: center;

  font-size: 9px;
  font-weight: 950;
}

.empty {
  padding: 35px 15px;

  text-align: center;

  color: var(--muted);

  font-size: 9px;
  font-weight: 850;
}


/* TEAM COLORS */

.auburn { background:#123f76; }
.parker { background:#151515; }
.cornercanyon { background:#27323e; }
.stfrances { background:#542772; }
.buford { background:#147747; }
.bosco { background:#142d54; }
.centennial { background:#262626; }
.imgacademy,
.img { background:#087bc1; }
.norland { background:#7c1026; }
.saraland { background:#b41529; }
.mckinney { background:#173f78; }
.guyer { background:#552a72; }
.stjames { background:#17365f; }
.dutchfork,
.silverfoxes { background:#000; }


.bottom-nav {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  width: calc(100% - 24px);
  max-width: 520px;

  height: 67px;

  z-index: 1000;

  padding: 6px;

  display: grid;
  grid-template-columns: repeat(5,1fr);

  background: rgba(255,255,255,.97);

  border: 1px solid #ddd;
  border-radius: 999px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);
}

.nav-item {
  text-decoration: none;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 999px;

  color: #929399;

  font-size: 7px;
  font-weight: 900;
}

.nav-icon {
  font-size: 17px;
  line-height: 1;
}

.nav-item.active {
  background: var(--red);
  color: white;
}

</style>
</head>


<body>

<main class="page">

  <h1>
    Standings
  </h1>


  <div class="top-tabs">

    <div class="top-tab active">
      Standings
    </div>

    <div class="top-tab">
      Series Tiers
    </div>

    <div class="top-tab">
      Playoff Bracket
    </div>

  </div>


  <div class="filters">

    <button
      class="filter active"
      data-filter="both"
    >
      BOTH
    </button>

    <button
      class="filter"
      data-filter="american"
    >
      AFC
    </button>

    <button
      class="filter"
      data-filter="national"
    >
      NFC
    </button>

  </div>


  <div id="standings"></div>

</main>



<nav class="bottom-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <div class="nav-icon">⌂</div>
    Home
  </a>

  <a
    class="nav-item active"
    href="standings.html"
  >
    <div class="nav-icon">≡</div>
    Standings
  </a>

  <a
    class="nav-item"
    href="scores.html"
  >
    <div class="nav-icon">▣</div>
    Scores
  </a>

  <a
    class="nav-item"
    href="stats.html"
  >
    <div class="nav-icon">▥</div>
    Stats
  </a>

  <a
    class="nav-item"
    href="more.html"
  >
    <div class="nav-icon">•••</div>
    More
  </a>

</nav>



<script>

const SUPABASE_URL =
  "https://btjpzkgblmuetsomnvpw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9FmVKyCrGSsBbu3LIni6eQ_U95Fl0Vj";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let teams = [];
let games = [];
let overrides = {};
let selectedFilter = "both";



function calculateRecords() {

  const records = {};


  teams.forEach(
    team => {

      records[
        team.slug
      ] = {

        wins: 0,
        losses: 0,
        pd: 0

      };

    }
  );


  games.forEach(
    game => {

      if (
        game.status !== "final"
        &&
        game.status !== "forfeit"
      ) {

        return;

      }


      if (
        game.away_score === null
        ||
        game.home_score === null
      ) {

        return;

      }


      const away =
        records[
          game.away_team
        ];


      const home =
        records[
          game.home_team
        ];


      if (
        !away
        ||
        !home
      ) {

        return;

      }


      away.pd +=
        game.away_score -
        game.home_score;


      home.pd +=
        game.home_score -
        game.away_score;


      if (
        game.away_score >
        game.home_score
      ) {

        away.wins++;
        home.losses++;

      }

      else if (
        game.home_score >
        game.away_score
      ) {

        home.wins++;
        away.losses++;

      }

    }
  );


  Object.entries(
    overrides
  )
  .forEach(
    ([slug,row]) => {

      if (
        !records[slug]
      ) {

        return;

      }


      if (
        row.wins !== null
      ) {

        records[slug].wins =
          row.wins;

      }


      if (
        row.losses !== null
      ) {

        records[slug].losses =
          row.losses;

      }


      if (
        row.pd !== null
      ) {

        records[slug].pd =
          row.pd;

      }

    }
  );


  return records;

}



function rankedTeams(
  conference
) {

  const records =
    calculateRecords();


  return teams
    .filter(
      team =>
        team.conference ===
        conference
    )
    .map(
      team => ({

        ...team,

        ...records[
          team.slug
        ]

      })
    )
    .sort(
      (a,b) => {

        if (
          b.wins !==
          a.wins
        ) {

          return (
            b.wins -
            a.wins
          );

        }


        if (
          a.losses !==
          b.losses
        ) {

          return (
            a.losses -
            b.losses
          );

        }


        if (
          b.pd !==
          a.pd
        ) {

          return (
            b.pd -
            a.pd
          );

        }


        return (
          a.display_order -
          b.display_order
        );

      }
    );

}



function rankClass(
  rank
) {

  if (
    rank <= 2
  ) {

    return "top";

  }


  if (
    rank <= 4
  ) {

    return "wild";

  }


  return "";

}



function rowsHtml(
  list,
  start,
  end
) {

  return list
    .slice(
      start,
      end
    )
    .map(
      (team,index) => {

        const rank =
          start +
          index +
          1;


        return `

          <div class="row">

            <div
              class="rank ${rankClass(rank)}"
            >
              ${rank}
            </div>


            <div class="team-cell">

              <div
                class="logo-box ${team.class_name || team.slug}"
              >

                <img
                  src="${team.logo_path}"
                  alt="${team.name}"
                >

              </div>

              <div class="team-name">
                ${team.name}
              </div>

            </div>


            <div class="number">
              ${team.wins}
            </div>


            <div class="number">
              ${team.losses}
            </div>


            <div class="number">
              ${team.pd > 0 ? "+" : ""}${team.pd}
            </div>

          </div>

        `;

      }
    )
    .join("");

}



function conferenceHtml(
  conference,
  title
) {

  const list =
    rankedTeams(
      conference
    );


  if (
    !list.length
  ) {

    return "";

  }


  return `

    <section class="conference-card">

      <div class="conference-header">

        <strong>
          ${title}
        </strong>

      </div>


      <div class="column-header">

        <span>#</span>
        <span>TEAM</span>
        <span>W</span>
        <span>L</span>
        <span>PD</span>

      </div>


      <div class="zone top">
        TOP 2
      </div>

      ${rowsHtml(list,0,2)}


      <div class="zone wild">
        WILD CARD
      </div>

      ${rowsHtml(list,2,4)}


      <div class="zone hunt">
        IN THE HUNT
      </div>

      ${rowsHtml(list,4,6)}

    </section>

  `;

}



function renderStandings() {

  const container =
    document.getElementById(
      "standings"
    );


  let html =
    "";


  if (
    selectedFilter ===
    "both"
    ||
    selectedFilter ===
    "american"
  ) {

    html +=
      conferenceHtml(
        "american",
        "AMERICAN CONFERENCE"
      );

  }


  if (
    selectedFilter ===
    "both"
    ||
    selectedFilter ===
    "national"
  ) {

    html +=
      conferenceHtml(
        "national",
        "NATIONAL CONFERENCE"
      );

  }


  container.innerHTML =
    html
    ||
    '<div class="empty">No standings data yet.</div>';

}



document
.querySelectorAll(
  "[data-filter]"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        selectedFilter =
          button.dataset.filter;


        document
        .querySelectorAll(
          "[data-filter]"
        )
        .forEach(
          item => {

            item.classList.toggle(
              "active",
              item === button
            );

          }
        );


        renderStandings();

      }
    );

  }
);



async function loadStandings() {

  const [
    teamResult,
    gameResult,
    overrideResult
  ] =
    await Promise.all([

      sb
        .from("hsfl_teams")
        .select("*")
        .eq("active",true)
        .order("display_order"),

      sb
        .from("hsfl_games")
        .select("*")
        .eq("season",2),

      sb
        .from("hsfl_team_record_overrides")
        .select("*")

    ]);


  if (
    teamResult.error
    ||
    gameResult.error
  ) {

    document.getElementById(
      "standings"
    ).innerHTML =
      '<div class="empty">Could not load standings.</div>';

    return;

  }


  teams =
    teamResult.data
    ||
    [];


  games =
    gameResult.data
    ||
    [];


  overrides =
    {};


  (
    overrideResult.data
    ||
    []
  )
  .forEach(
    row => {

      overrides[
        row.team_slug
      ] =
        row;

    }
  );


  renderStandings();

}


loadStandings();

</script>

</body>
</html>
